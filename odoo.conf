[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo/data
admin_passwd = ***
dbfilter = ^%h$
list_db = False
db_host = postgresql
db_port = 5432
db_template = template1
db_name = tomagency.griffity.de
db_user = ***
db_password = ***

proxy_mode = True

; multi-process mode: 8 cores / 16 GB / ~8 concurrent users
; requires nginx to route /websocket to odoo:8072 (nginx-conf-new/)
workers = 6
max_cron_threads = 2
gevent_port = 8072

; limits per worker (only enforced with workers > 0)
; limit_time_real must stay <= proxy_read_timeout in nginx (1200s)
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_request = 8192

; connections per process: 9 processes (6 workers + 2 cron + 1 gevent) x 10 = 90 < 100 (PostgreSQL max_connections)
db_maxconn = 10

# default values
; addons_path = /mnt/extra-addons
; data_dir = /var/lib/odoo
; admin_passwd = admin
; csv_internal_sep = ,
; db_maxconn = 64
; db_name = False
; db_template = template1
; dbfilter = .*
; debug_mode = False
; email_from = False
; limit_memory_hard = 2684354560
; limit_memory_soft = 2147483648
; limit_request = 8192
; limit_time_cpu = 60
; limit_time_real = 120
; list_db = True
; log_db = False
; log_handler = [':INFO']
; log_level = info
; logfile = None
; longpolling_port = 8072
; max_cron_threads = 2
; osv_memory_age_limit = 1.0
; osv_memory_count_limit = False
; smtp_password = False
; smtp_port = 25
; smtp_server = localhost
; smtp_ssl = False
; smtp_user = False
; workers = 0
; xmlrpc = True
; xmlrpc_interface =
