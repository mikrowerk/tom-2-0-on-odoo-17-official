#
# Reverse proxy (nginx) and certificate renewal (certbot). nginx is the only service with public
# ports; it reaches the Odoo instances on ingress-net by their alias (e.g. odoo-griffity-prod).
# Certificates live on the host in CERTBOT_DIR; conf.d/ssl-dhparams.pem is created by ../setup.sh.

name: ingress

services:
  nginx:
    image: docker.io/library/nginx:1.30
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ${CERTBOT_DIR:-/opt/certbot}:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    networks:
      - ingress-net

  certbot:
    image: docker.io/certbot/certbot
    restart: unless-stopped
    volumes:
      - ${CERTBOT_DIR:-/opt/certbot}:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot_www:
    external: true

networks:
  ingress-net:
    external: true
