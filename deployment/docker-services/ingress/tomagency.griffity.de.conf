server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name tomagency.griffity.de;
    server_tokens off;

    include /etc/nginx/conf.d/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/conf.d/ssl-dhparams.pem;
    ssl_certificate /etc/letsencrypt/live/tomagency.griffity.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomagency.griffity.de/privkey.pem;

    location / {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo-backend;
        client_max_body_size 800M;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
    location ~* /web/static/ {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo-backend;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
    }
}