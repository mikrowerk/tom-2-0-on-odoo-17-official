# Define a server for odoo backend (port 8069, as configured on the odoo.conf file (odoo file) )
# odoo-griffity-prod is the alias of the Odoo container on ingress-net. It is resolved at runtime
# via the Docker DNS (127.0.0.11), so nginx also starts while the Odoo stack is down (502 until
# it is up). `resolve` in an upstream needs nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream odoo-backend {
    zone odoo-backend 64k;
    server odoo-griffity-prod:8069 resolve;
}

# Connection header for the websocket upgrade on /websocket (see the vhost)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen [::]:80;
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }
    location / {
        return  301 https://$host$request_uri;
    }
}