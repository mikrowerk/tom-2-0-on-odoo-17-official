server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name tomagency.griffity.de;
    server_tokens off;

    include /etc/nginx/conf.d/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/conf.d/ssl-dhparams.pem;
    ssl_certificate /etc/letsencrypt/live/tomagency.griffity.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomagency.griffity.de/privkey.pem;

    location / {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo-backend;
        client_max_body_size 800M;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
    # Live updates (chatter, notifications, presence) of the Odoo bus. nginx only forwards the
    # websocket upgrade with HTTP/1.1 and explicit Upgrade/Connection headers. odoo.conf does not
    # set workers (threaded server), so /websocket is served on 8069 like everything else; with
    # workers > 0 it has to go to the gevent port 8072 instead (see archive/nginx-conf-new).
    location /websocket {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_pass http://odoo-backend;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~* /web/static/ {
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://odoo-backend;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
    }
}