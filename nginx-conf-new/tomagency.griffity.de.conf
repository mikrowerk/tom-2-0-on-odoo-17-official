server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name tomagency.griffity.de;

    include /etc/nginx/conf.d/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/conf.d/ssl-dhparams.pem;
    ssl_certificate /etc/letsencrypt/live/tomagency.griffity.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomagency.griffity.de/privkey.pem;

    # Odoo sets X-Frame-Options and X-Content-Type-Options itself
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # inherited by every location below that does not set its own proxy_set_header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # must be >= limit_time_real in odoo.conf, otherwise nginx aborts long reports/exports first
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_connect_timeout 10s;
    client_max_body_size 800M;

    # --- blocked ---------------------------------------------------------------------------------
    # database manager (list_db = False disables it in Odoo as well)
    location ^~ /web/database {
        return 404;
    }
    # source maps only exist with ?debug=assets (served under /web/assets/debug/, not *.map)
    location ~* \.map$ {
        access_log off;
        log_not_found off;
        return 404;
    }
    # dotfiles (.git, .env, ...) and common scanner paths - never Odoo routes
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* ^/(wp-|wordpress|xmlrpc\.php|phpmyadmin|pma|cgi-bin|vendor/|rest/api/|actuator|solr|boaform) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- rate limited login ----------------------------------------------------------------------
    location = /web/login {
        limit_req zone=odoo_login burst=20 nodelay;
        proxy_pass http://odoo-backend;
    }
    location = /web/session/authenticate {
        limit_req zone=odoo_login burst=20 nodelay;
        proxy_pass http://odoo-backend;
    }
    location = /web/reset_password {
        limit_req zone=odoo_login burst=20 nodelay;
        proxy_pass http://odoo-backend;
    }

    # --- live updates (chatter, notifications); needs workers > 0 in odoo.conf --------------------
    location /websocket {
        proxy_pass http://odoo-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- Odoo ------------------------------------------------------------------------------------
    location ~* /web/static/ {
        proxy_pass http://odoo-backend;
        expires 10d;
    }
    location / {
        proxy_pass http://odoo-backend;
    }
}
