# http-level settings: every *.conf in conf.d is included inside the http {} block of nginx.conf

server_tokens off;

# brute-force protection for the login endpoints (per client IP)
limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=10r/m;
limit_req_status 429;

# compress text responses (assets, JSON-RPC)
gzip on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# websocket upgrade header for /websocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Odoo HTTP workers (port 8069) and gevent/websocket process (port 8072, only with workers > 0)
upstream odoo-backend {
    server odoo:8069;
}
upstream odoo-websocket {
    server odoo:8072;
}

# port 80: ACME challenge for certbot, everything else to https
server {
    listen [::]:80;
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# port 443 catch-all: requests for the bare IP or unknown host names are dropped in the TLS handshake
server {
    listen [::]:443 ssl default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
